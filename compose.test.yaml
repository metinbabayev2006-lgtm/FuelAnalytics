name: fuelanalytics-integration-tests
services:
  postgres-test:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: fuelanalytics_test
      POSTGRES_USER: fuelanalytics_test
      POSTGRES_PASSWORD: synthetic_test_only
    ports:
      - "127.0.0.1:55433:5432"
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fuelanalytics_test -d fuelanalytics_test"]
      interval: 2s
      timeout: 5s
      retries: 20
