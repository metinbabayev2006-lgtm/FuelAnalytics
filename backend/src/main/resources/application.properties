spring.application.name=backend
# Start Maven from backend/; Docker Compose uses the same local .env file.
spring.config.import=optional:file:../.env[.properties]
spring.datasource.url=${DB_URL:jdbc:postgresql://127.0.0.1:5433/fuelanalytics}
spring.datasource.username=${DB_USER:fuelanalytics}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.sql.init.mode=never
spring.flyway.clean-disabled=true
