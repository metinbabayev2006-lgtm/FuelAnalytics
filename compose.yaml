name: fuelanalytics

services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: fuelanalytics
      POSTGRES_USER: fuelanalytics
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fuelanalytics -d fuelanalytics"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  postgres_data:
