name: Build and test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - run: chmod +x mvnw && ./mvnw -B verify
        working-directory: backend
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_DB: fuelanalytics_test
          POSTGRES_USER: fuelanalytics_test
          POSTGRES_PASSWORD: synthetic-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fuelanalytics_test -d fuelanalytics_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      SPRING_DATASOURCE_URL: jdbc:postgresql://127.0.0.1:5432/fuelanalytics_test
      SPRING_DATASOURCE_USERNAME: fuelanalytics_test
      SPRING_DATASOURCE_PASSWORD: synthetic-ci-only
      TANKERKOENIG_API_KEY: ''
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - run: chmod +x mvnw && ./mvnw -B test
        working-directory: backend
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm test && npm run lint && npm run build
        working-directory: frontend
